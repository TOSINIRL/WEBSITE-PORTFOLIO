kind = "web"
previewPath = "/"
title = "tosincreates.com"
version = "1.0.0"
id = "artifacts/tosincreates"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22718

[services.development]
run = "pnpm --filter @workspace/tosincreates run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/tosincreates", "run", "build" ]
serve = "static"
publicDir = "artifacts/tosincreates/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22718"
BASE_PATH = "/"
